name: Daily Weather Telegram Bot

# 수동 실행 및 자동 스케줄링
on:
  workflow_dispatch:
  schedule:
    # 매일 KST 기준 12시 (UTC 기준 03시)
    - cron: "0 3 * * *"

env:
  TZ: "Asia/Seoul"

jobs:
  weather:
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃 레포
        uses: actions/checkout@v3

      - name: Python 설정
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install requests pytz

      - name: Telegram 날씨 봇 실행
        run: python weather_test1.py
        env:
          KMA_KEY: ${{ secrets.KMA_KEY }}
          AIR_KEY: ${{ secrets.AIR_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

