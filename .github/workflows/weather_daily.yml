name: Daily Weather Telegram Bot

on:
  schedule:
    - cron: '3 3 * * *' # UTC 기준 → KST 12:03
  workflow_dispatch:    # 수동 실행 옵션

jobs:
  send_weather:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Set environment variables
        run: |
          echo "KMA_KEY=${{ secrets.KMA_KEY }}" >> $GITHUB_ENV
          echo "AIRKOREA_KEY=${{ secrets.AIRKOREA_KEY }}" >> $GITHUB_ENV
          echo "TG_TOKEN=${{ secrets.TG_TOKEN }}" >> $GITHUB_ENV
          echo "TG_CHAT_ID=${{ secrets.TG_CHAT_ID }}" >> $GITHUB_ENV

      - name: Run Weather Bot
        run: python weather_test1.py

